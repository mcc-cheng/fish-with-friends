<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f3ef">
    <meta name="description" content="Play Fish (also known as Literature), the team card game, online with friends.">
    <title>Fish with Friends</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1b19'/%3E%3Cpath d='M5 16c3.6-5.4 9.4-6.9 14.2-5 1.9.8 3.4 2 4.8 3.4L27 11v10l-3-3.4c-1.4 1.4-2.9 2.6-4.8 3.4-4.8 1.9-10.6.4-14.2-5z' fill='%23ffffff'/%3E%3Ccircle cx='11' cy='15' r='1.3' fill='%231b1b19'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
    <script>
      // Pick the theme before anything is drawn: the player's saved choice, or else the system's.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('fish:theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding: 2rem; text-align: center">Fish needs JavaScript to run.</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
